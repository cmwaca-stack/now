<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // key 100개("a", "a1" ~ "a99"), key마다 배열 길이가 다름 (100 ~ 199개)
        let data = {}
        for (let i = 0; i < 100; i++) {
            const key = i === 0 ? "a" : "a" + i
            data[key] = Array.from({length: 100 + i}, (_, j) => i * 1000 + j)
        }
        const show = (id)=> console.log(id+" 를 보여줘")
        let v = [1,2,3,5,7]
        for (const i of v) {
            for (const element of data["a"+i]) {
                console.log(element+"\n")
                show(element)
            }
        }

    </script>
</body>
</html>
