<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 여행 추천 에이전트</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", "Malgun Gothic", sans-serif; display: flex; height: 100vh; color: #1f2937; }
        #side { width: 380px; max-width: 45vw; overflow-y: auto; padding: 16px; background: #f4f8f7; border-right: 1px solid #d6e2df; }
        #map { flex: 1; }
        h1 { font-size: 18px; margin: 0 0 4px; color: #0f766e; }
        .sub { font-size: 12px; color: #6b7280; margin-bottom: 12px; }
        textarea { width: 100%; height: 72px; padding: 8px; border: 1px solid #b7cdc8; border-radius: 8px; font: inherit; resize: vertical; }
        button { background: #0f766e; color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
        button:disabled { background: #9ab5b0; cursor: wait; }
        .chips { margin: 8px 0; display: flex; flex-wrap: wrap; gap: 6px; }
        .chips span { font-size: 12px; background: #e0efec; border-radius: 12px; padding: 4px 10px; cursor: pointer; }
        .chips span:hover { background: #cfe5e0; }
        .card { background: #fff; border: 1px solid #d6e2df; border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 13px; }
        .card h3 { margin: 0 0 6px; font-size: 13px; color: #0f766e; }
        .step { padding: 3px 0; }
        .place { cursor: pointer; padding: 6px 0; border-top: 1px solid #eef3f2; }
        .place:first-of-type { border-top: 0; }
        .place b { font-size: 14px; }
        .tag { font-size: 11px; border-radius: 6px; padding: 1px 6px; background: #fde68a; margin-left: 4px; }
        .tag.in { background: #bfdbfe; }
        .warn { color: #b45309; }
        @media (max-width: 700px) { body { flex-direction: column-reverse; } #side { width: 100%; max-width: none; height: 55vh; } #map { height: 45vh; flex: none; } }
    </style>
</head>
<body>
    <div id="side">
        <h1>🏝️ 제주 여행 추천 에이전트</h1>
        <div class="sub">AI가 관광지 찾기(find_spots)와 날씨 보기(get_weather) 도구를 스스로 골라 써서 추천해요.</div>
        <textarea id="q" placeholder="예) 내일 서쪽에서 비 와도 갈 만한 곳 추천해줘"></textarea>
        <div class="chips" id="chips">
            <span>내일 동쪽에서 갈 만한 곳</span>
            <span>오늘 서귀포 비 와도 괜찮은 곳</span>
            <span>제주시 근처 실내 데이트</span>
        </div>
        <button id="ask">물어보기</button>
        <div id="out"></div>
    </div>
    <div id="map"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script>
        const $ = id => document.getElementById(id)
        const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))

        const map = L.map("map").setView([33.38, 126.55], 10)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors", maxZoom: 18,
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        document.querySelectorAll("#chips span").forEach(c => c.onclick = () => { $("q").value = c.textContent; ask() })

        const ask = async () => {
            const question = $("q").value.trim()
            if (!question) return
            $("ask").disabled = true
            $("out").innerHTML = `<div class="card">도구를 고르는 중...</div>`
            layer.clearLayers()
            try {
                const r = await fetch("/api/agent", {
                    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ question }),
                })
                if (!r.ok) throw new Error(r.status)
                show(await r.json())
            } catch (e) {
                $("out").innerHTML = `<div class="card warn">에이전트 서버(/api/agent)에 연결하지 못했어요. 배포된(Vercel) 주소에서 열어 주세요.</div>`
            }
            $("ask").disabled = false
        }
        $("ask").onclick = ask

        const show = d => {
            let html = ""
            if (d.steps && d.steps.length)
                html += `<div class="card"><h3>🔍 에이전트가 한 일</h3>${d.steps.map(s => `<div class="step">• ${esc(s.text)}</div>`).join("")}</div>`
            if (d.weather && d.weather.ok)
                html += `<div class="card"><h3>☁️ 날씨</h3>${esc(d.weather.area)} ${esc(d.weather.day)} · ${esc(d.weather.sky)}<br>강수확률 ${esc(d.weather.rain_prob)}% · ${esc(d.weather.tmin)}~${esc(d.weather.tmax)}℃ · 최대 풍속 ${esc(d.weather.wind)}km/h</div>`
            if (d.places && d.places.length) {
                html += `<div class="card"><h3>📍 추천 장소</h3>${d.places.map((p, i) =>
                    `<div class="place" data-i="${i}"><b>${esc(p.name)}</b>` +
                    (p.inList ? `<span class="tag in">${p.indoor ? "실내" : "야외"}</span>` : `<span class="tag">목록에 없음 ⚠</span>`) +
                    `<div>${esc(p.why)}</div></div>`).join("")}</div>`
                if (d.judge) html += `<div class="card"><h3>🧭 판단</h3>${esc(d.judge)}</div>`
            }
            if (d.text) html += `<div class="card">${esc(d.text)}</div>`
            if (d.tip) html += `<div class="card sub">${esc(d.tip)}</div>`
            $("out").innerHTML = html

            const pts = []
            ;(d.places || []).forEach((p, i) => {
                if (!p.lat) return
                L.marker([p.lat, p.lon]).addTo(layer).bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.why)}`)
                pts.push([p.lat, p.lon])
            })
            if (pts.length) map.flyToBounds(pts, { maxZoom: 11, padding: [60, 60] })
            document.querySelectorAll(".place").forEach(el => el.onclick = () => {
                const p = d.places[el.dataset.i]
                if (p.lat) map.flyTo([p.lat, p.lon], 12)
            })
        }
    </script>
</body>
</html>
